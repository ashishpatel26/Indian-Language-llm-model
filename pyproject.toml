[project]
name = "indian-language-llm"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "transformers>=4.46",
    "datasets>=3.0",
    "sentencepiece>=0.2",
    "numpy",
    "tqdm",
    "protobuf",
]

[project.optional-dependencies]
opt = ["bitsandbytes>=0.45"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
